<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ботаникалық бақ · ХҚТУ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>



<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070e0b; --bg2:#0d1a13; --bg3:#13231a; --bg4:#192d20;
  --accent:#5de8af; --accent2:#3bba88; --accentd:#1a4f36;
  --text:#ddf0e7; --text2:#7aaa8e; --text3:#3a6a50;
  --border:rgba(93,232,175,.13); --border2:rgba(93,232,175,.08);
  --hh:52px; --sw:282px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh}
#app-body{display:flex;flex:1;overflow:hidden;min-height:0}

/* ── HEADER ── */
#app-header{
  height:var(--hh);flex-shrink:0;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;gap:10px;
  backdrop-filter:blur(10px);
  position:relative;z-index:100;
}
.hdr-brand{display:flex;align-items:baseline;gap:10px;flex-shrink:0}
#hdr-title{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.07em;white-space:nowrap}
#hdr-sub{font-size:10px;color:var(--text2);white-space:nowrap}
.hdr-controls{display:flex;align-items:center;gap:8px}

/* Lang */
.lang-group{display:flex;background:var(--bg);border:1px solid var(--border2);border-radius:7px;padding:2px;gap:2px}
.lang-btn{font-family:'Unbounded',sans-serif;font-size:8px;font-weight:700;padding:4px 7px;border:none;border-radius:5px;cursor:pointer;background:transparent;color:var(--text2);transition:all .18s;letter-spacing:.05em}
.lang-btn.active{background:var(--accent);color:var(--bg)}
.lang-btn:hover:not(.active){background:var(--bg3);color:var(--text)}

/* Toggle */
.view-toggle{
  display:flex;background:var(--bg);
  border:1px solid var(--border);border-radius:9px;padding:3px;gap:3px;
}
.tog-btn{
  font-family:'Unbounded',sans-serif;font-size:9px;font-weight:700;
  padding:5px 12px;border:none;border-radius:7px;cursor:pointer;
  background:transparent;color:var(--text2);
  transition:all .2s;letter-spacing:.05em;
  display:flex;align-items:center;gap:5px;
}
.tog-btn.active{background:var(--accent);color:var(--bg);box-shadow:0 2px 14px rgba(93,232,175,.3)}
.tog-btn:hover:not(.active){background:var(--bg3);color:var(--text)}
.tog-icon{font-size:11px}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sw);flex-shrink:0;
  display:flex;flex-direction:column;
  background:var(--bg2);
  border-right:1px solid var(--border);
  overflow:hidden;
  position:relative;z-index:10;
}

/* Back btn */
#back-btn{
  display:none;align-items:center;gap:6px;
  padding:9px 14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;background:transparent;border:none;width:100%;
  color:var(--accent);font-size:11px;font-weight:500;font-family:'DM Sans',sans-serif;
  transition:background .18s;text-align:left;
}
#back-btn.show{display:flex}
#back-btn:hover{background:rgba(93,232,175,.07)}
#back-btn svg{transition:transform .18s}
#back-btn:hover svg{transform:translateX(-2px)}

/* Zone list */
#zone-list-section{
  flex-shrink:0;display:flex;flex-direction:column;
  border-bottom:1px solid var(--border);
  max-height:42%;
}
.zl-header{
  padding:9px 14px 7px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.zl-header-title{font-family:'Unbounded',sans-serif;font-size:8px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
#zone-count-badge{
  background:var(--accentd);color:var(--accent);
  font-size:8px;font-weight:700;padding:2px 6px;border-radius:8px;
  font-family:'Unbounded',sans-serif;
}
#zone-list{
  overflow-y:auto;flex:1;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.zl-item{
  padding:6px 14px;display:flex;align-items:center;gap:8px;
  cursor:pointer;transition:background .15s;
  border-left:2px solid transparent;
}
.zl-item:hover{background:rgba(93,232,175,.07)}
.zl-item.active{
  background:rgba(93,232,175,.1);
  border-left-color:var(--accent);
}
.zl-num{
  font-family:'Unbounded',sans-serif;font-size:9px;font-weight:700;
  color:var(--accent);min-width:28px;flex-shrink:0;
}
.zl-name{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Info panel */
#info-section{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;display:flex;flex-direction:column}
#panel-content{padding:14px;flex:1}
.panel-anim{animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.p-tag{font-size:8px;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:4px;opacity:.9}
.p-title{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;color:var(--text);line-height:1.45;margin-bottom:2px}
.p-subtitle{font-size:10px;color:var(--text2);margin-bottom:12px}
.p-img{width:100%;height:72px;background:linear-gradient(135deg,var(--bg3) 0%,var(--bg4) 100%);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:11px;border:1px solid var(--border)}
.p-img-icon{font-size:28px}
.p-desc{font-size:11px;line-height:1.65;color:var(--text2);margin-bottom:12px}
.p-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:12px}
.stat-card{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 10px}
.stat-label{font-size:8px;color:var(--text3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.stat-val{font-family:'Unbounded',sans-serif;font-size:12px;color:var(--accent);font-weight:700}
.p-props{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.prop-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg3);border-radius:7px;border:1px solid var(--border2)}
.prop-key{font-size:10px;color:var(--text2)}
.prop-val{font-size:10px;color:var(--text);font-weight:600}
.p-hint{font-size:10px;color:var(--text3);display:flex;align-items:flex-start;gap:6px;line-height:1.6;padding:9px 10px;background:var(--bg3);border-radius:8px;border:1px solid var(--border2)}
.p-hint-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:3px;opacity:.7}
#panel-footer{
  padding:9px 14px;font-size:8px;color:var(--text3);
  letter-spacing:.07em;border-top:1px solid var(--border2);
  font-family:'Unbounded',sans-serif;flex-shrink:0;
}

/* ── VIEWPORT ── */
#viewport-area{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#map-view,#canvas-view{position:absolute;inset:0}
#canvas-view{display:none}

/* Leaflet overrides */
#map{height:100%;width:100%}
.leaflet-container{background:#070e0b !important}
.leaflet-control-layers{background:rgba(13,26,19,.95)!important;border:1px solid rgba(93,232,175,.2)!important;border-radius:8px!important;color:var(--text)!important}
.leaflet-control-layers-selector{accent-color:var(--accent)}
.leaflet-bar a{background:rgba(13,26,19,.95)!important;border-color:rgba(93,232,175,.2)!important;color:var(--accent)!important}
.leaflet-bar a:hover{background:var(--bg3)!important}
.zone-lbl{font-family:'Unbounded',sans-serif;font-size:9px;font-weight:700;color:#5de8af;text-shadow:0 1px 4px rgba(0,0,0,.9);pointer-events:none;white-space:nowrap}

/* 3D canvas */
#canvas3d{width:100%;height:100%;display:block}

/* Loading */
#loading{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .5s}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:32px;height:32px;border:2px solid rgba(93,232,175,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-label{font-family:'Unbounded',sans-serif;font-size:10px;color:var(--accent);letter-spacing:.09em}
#load-pct{font-family:'Unbounded',sans-serif;font-size:26px;color:var(--text);font-weight:700}
#loader-bar-wrap{width:140px;height:2px;background:var(--bg3);border-radius:2px;overflow:hidden}
#loader-bar{height:100%;width:0;background:var(--accent);transition:width .15s;border-radius:2px}

/* Cursor hints */
.cursor-hint{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  background:rgba(7,14,11,.88);border:1px solid var(--border);
  color:var(--text2);font-size:10px;padding:7px 15px;border-radius:20px;
  pointer-events:none;backdrop-filter:blur(10px);
  font-family:'Unbounded',sans-serif;letter-spacing:.04em;
  transition:opacity .3s;white-space:nowrap;
}
.cursor-hint.hide{opacity:0}

/* Mode transition */
.view-fade-in{animation:viewFade .3s ease}
@keyframes viewFade{from{opacity:0}to{opacity:1}}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* Mobile */
@media(max-width:768px){
  :root{--sw:100%}
  #app-body{flex-direction:column}
  #sidebar{width:100%;max-height:44vh;border-right:none;border-bottom:1px solid var(--border)}
  #zone-list-section{max-height:38%}
  #hdr-sub{display:none}
}
</style>
<script type="importmap">{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}</script>
  <script type="module" crossorigin src="/assets/index-BMesNsWu.js"></script>
</head>
<body>
<div id="app">

<!-- ── HEADER ── -->
<header id="app-header">
  <div class="hdr-brand">
    <span id="hdr-title">Ботаникалық бақ</span>
    <span id="hdr-sub">Қ.А. Яссауи атындағы ХҚТУ</span>
  </div>
  <div class="hdr-controls">
    <div class="lang-group">
      <button class="lang-btn active" data-lang="kk">ҚАЗ</button>
      <button class="lang-btn" data-lang="ru">РУС</button>
      <button class="lang-btn" data-lang="en">ENG</button>
      <button class="lang-btn" data-lang="tr">TUR</button>
    </div>
    <div class="view-toggle">
      <button id="btn-2d" class="tog-btn active">
        <span class="tog-icon">🗺</span>2D
      </button>
      <button id="btn-3d" class="tog-btn">
        <span class="tog-icon">🧊</span>3D
      </button>
    </div>
  </div>
</header>

<!-- ── BODY ── -->
<div id="app-body">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <button id="back-btn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="back-label">Артқа</span>
    </button>

    <div id="zone-list-section">
      <div class="zl-header">
        <span class="zl-header-title" id="zones-title-label">Зоналар тізімі</span>
        <span id="zone-count-badge">53</span>
      </div>
      <div id="zone-list"></div>
    </div>

    <div id="info-section">
      <div id="panel-content"></div>
      <div id="panel-footer">ХҚТУ · Ботаникалық бақ</div>
    </div>
  </aside>

  <!-- VIEWPORT -->
  <div id="viewport-area">

    <!-- 2D MAP -->
    <div id="map-view">
      <div id="map"></div>
      <div class="cursor-hint" id="cursor-hint-2d">Зонаны басыңыз</div>
    </div>

    <!-- 3D CANVAS -->
    <div id="canvas-view">
      <canvas id="canvas3d"></canvas>
      <div id="loading">
        <div class="spinner"></div>
        <div id="load-pct">0%</div>
        <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
        <span id="loading-label">Жүктелуде…</span>
      </div>
      <div class="cursor-hint" id="cursor-hint-3d">3D моделдегі зонаны басыңыз</div>
    </div>

  </div>
</div><!-- app-body -->
</div><!-- app -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</body>
</html>
