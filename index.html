<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ХҚТУ Ботаникалық бағы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #070e08;
      --panel-bg: #0b160d;
      --border: #1c3520;
      --accent: #5cdb6a;
      --text: #ddeade;
      --text-dim: #6b8f6f;
      --glass: rgba(11,22,13,0.9);
    }

    html, body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      /* Desktop: fixed full viewport */
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── LOADING ── */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      transition: opacity 0.7s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    .loader-svg { width: 80px; height: 80px; margin-bottom: 24px; }
    .loader-ring-outer {
      animation: spinSlow 6s linear infinite;
      transform-origin: 40px 40px;
    }
    .loader-ring-inner {
      animation: spinSlow 3s linear infinite reverse;
      transform-origin: 40px 40px;
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }

    .loader-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px; letter-spacing: 0.1em;
      color: var(--text-dim); margin-bottom: 4px;
    }
    #load-pct { font-size: 13px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 14px; }
    .bar-wrap { width: 220px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
    #loader-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.25s; border-radius: 2px; }

    /* ── HEADER ── */
    #header {
      height: 54px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(7,14,8,0.97);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 11px; }
    .logo-leaf {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #2d6a35, #5cdb6a);
      border-radius: 50% 8% 50% 8%;
      transform: rotate(-30deg);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .logo-texts h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 16px; font-weight: 600; line-height: 1.15; }
    .logo-texts small { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); }

    .langs { display: flex; gap: 4px; }
    .lang-btn {
      padding: 5px 11px; border-radius: 4px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-dim); font-size: 11px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.08em;
      cursor: pointer; transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
      /* Prevent touch delay */
      touch-action: manipulation;
    }
    .lang-btn:hover { border-color: var(--accent); color: var(--accent); }
    .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #060d07; font-weight: 700; }

    /* ── MAIN ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
      /* Desktop: side-by-side */
      flex-direction: row;
    }

    /* ── VIEWPORT ── */
    #viewport {
      flex: 0 0 65%;
      position: relative;
      background: #020706;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      /* Prevent default touch actions so OrbitControls gets them */
      touch-action: none;
    }

    /* Cursor hint bar */
    #cursor-hint {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 18px;
      font-size: 12px; color: var(--text-dim);
      backdrop-filter: blur(8px); pointer-events: none;
      white-space: nowrap; transition: opacity 0.3s;
    }
    #cursor-hint.hide { opacity: 0; }

    /* Back button */
    #back-btn {
      position: absolute; top: 14px; left: 14px;
      background: var(--glass); border: 1px solid var(--border);
      color: var(--text); padding: 8px 15px;
      border-radius: 6px; cursor: pointer;
      font-size: 12px; font-family: 'DM Sans', sans-serif;
      display: none; align-items: center; gap: 7px;
      backdrop-filter: blur(8px); transition: all 0.15s;
      touch-action: manipulation;
    }
    #back-btn:hover { border-color: var(--accent); color: var(--accent); }
    #back-btn.show { display: flex; }

    /* ── INFO PANEL ── */
    #info-panel {
      flex: 0 0 35%;
      border-left: 1px solid var(--border);
      background: var(--panel-bg);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    #panel-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
    }
    #panel-scroll::-webkit-scrollbar { width: 3px; }
    #panel-scroll::-webkit-scrollbar-track { background: transparent; }
    #panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Panel components */
    .p-head {
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
      background: var(--panel-bg); z-index: 5;
    }
    .p-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 20px;
      border: 1px solid rgba(92,219,106,0.3);
      background: rgba(92,219,106,0.07);
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--accent); margin-bottom: 10px;
    }
    .p-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; font-weight: 600; line-height: 1.2; }
    .p-subtitle { margin-top: 3px; font-size: 12px; color: var(--text-dim); }
    .p-body { padding: 18px 22px; }
    .p-img {
      width: 100%; height: 148px; border-radius: 8px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, #0c1f0e 0%, #152c19 100%);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px; overflow: hidden;
    }
    .p-img-icon { font-size: 52px; opacity: 0.2; }
    .p-desc { font-size: 13.5px; line-height: 1.75; color: #9dbfa0; }
    .p-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .stat-card { background: rgba(255,255,255,0.025); border: 1px solid var(--border); border-radius: 7px; padding: 13px; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 4px; }
    .stat-val { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; color: var(--accent); line-height: 1; }
    .p-props { margin-top: 16px; }
    .prop-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid rgba(28,53,32,0.6); font-size: 13px; }
    .prop-key { color: var(--text-dim); }
    .prop-val { color: var(--text); font-weight: 500; }
    .p-hint {
      margin: 0 22px 18px; padding: 12px 14px; border-radius: 7px;
      background: rgba(92,219,106,0.04); border: 1px solid rgba(92,219,106,0.14);
      font-size: 12.5px; color: var(--text-dim);
      display: flex; gap: 10px; align-items: flex-start; line-height: 1.55;
    }
    .p-hint-icon { color: var(--accent); font-size: 14px; flex-shrink: 0; margin-top: 2px; }
    .p-footer {
      padding: 11px 22px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text-dim); text-align: center; flex-shrink: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .panel-anim { animation: fadeUp 0.3s ease forwards; }

    /* ══════════════════════════════════════════════════
       MOBILE LAYOUT  (≤ 768 px)
       ══════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      html, body {
        height: auto;
        overflow: auto;   /* page scrolls on mobile */
      }

      #header {
        padding: 0 12px;
        height: 48px;
      }
      .logo-texts h1 { font-size: 13px; }
      .logo-texts small { display: none; }
      .lang-btn { padding: 4px 8px; font-size: 10px; }

      #main {
        flex-direction: column;   /* stack vertically */
        overflow: visible;
        height: auto;
      }

      #viewport {
        flex: none;
        width: 100%;
        height: 55svh;   /* sensible fixed height for the 3-D canvas */
        min-height: 280px;
      }

      #info-panel {
        flex: none;
        width: 100%;
        border-left: none;
        border-top: 1px solid var(--border);
        /* Let content determine height – no overflow clipping */
        overflow: visible;
        height: auto;
      }

      #panel-scroll {
        overflow: visible;   /* panel scrolls with the page */
        height: auto;
      }

      /* Sticky header inside panel loses sticky on mobile (page scroll) */
      .p-head { position: static; }

      .p-title { font-size: 22px; }
    }
  </style>
</head>

const KK_TYPES = ['Дендрология','Көпжылдық шөптесіндер','Раушан бағы','Дәрілік өсімдіктер','Дала флорасы','Қылқан жапырақтылар','Су өсімдіктері','Пияздық коллекция','Сәндік астықтар','Көлеңкелі бақша','Альпі өсімдіктері','Тропикалық үй'];
const RU_TYPES = ['Дендрология','Травянистые многолетники','Розарий','Лекарственные растения','Степная флора','Хвойные','Водные растения','Луковичные','Декоративные злаки','Теневой сад','Альпийские растения','Тропикарий'];
const TR_TYPES = ['Dendroloji','Çok Yıllık Bitkiler','Gül Bahçesi','Tıbbi Bitkiler','Bozkır Florası','İğne Yapraklılar','Su Bitkileri','Soğanlı Bitkiler','Süs Çimleri','Gölge Bahçesi','Alp Bitkileri','Tropikal Ev'];

for (let i = 1; i <= 48; i++) {
  const ti = (i - 1) % EN_TYPES.length;
  const pc = 15 + (i * 7 % 60);
  ZONE_DATA[String(i)] = {
    kk:{ name:`${i}-зона`, desc:`${i}-зона — ботаникалық бақтың ${KK_TYPES[ti].toLowerCase()} бөлімі. Зонада ${pc}-дан астам белгіленген өсімдік түрі бар, жүйелі зерттеулер жүргізілуде.`, type:KK_TYPES[ti], plants:`${pc}+` },
    ru:{ name:`Зона ${i}`, desc:`Зона ${i} — раздел ${RU_TYPES[ti].toLowerCase()} ботанического сада. В зоне насчитывается более ${pc} задокументированных видов, ведутся систематические исследования.`, type:RU_TYPES[ti], plants:`${pc}+` },
    en:{ name:`Zone ${i}`, desc:`Zone ${i} is the ${EN_TYPES[ti]} section of the botanical garden. It features over ${pc} documented species and is subject to ongoing systematic research.`, type:EN_TYPES[ti], plants:`${pc}+` },
    tr:{ name:`Bölge ${i}`, desc:`Bölge ${i}, botanik bahçesinin ${TR_TYPES[ti]} bölümüdür. ${pc}+ belgelenmiş türe sahiptir ve sistematik araştırmalar sürdürülmektedir.`, type:TR_TYPES[ti], plants:`${pc}+` },
  };
}

const ZONE_NAMES = new Set([
  'cont','okr',
  ...Array.from({length:48},(_,i)=>String(i+1)),
  '2.1','13.1','14.1','24.1','25.1',
]);

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
let currentLang  = 'kk';
let selectedZone = null;

// ═══════════════════════════════════════════════════════════════════════════
// SCENE SETUP
// ═══════════════════════════════════════════════════════════════════════════
const canvas   = document.getElementById('canvas');
const viewport = document.getElementById('viewport');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 100));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;

const scene  = new THREE.Scene();
new RGBELoader().load(
  'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/venice_sunset_1k.hdr',
  tex => {
    tex.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = tex;      // барлық материалдарға env reflection
    // scene.background = tex;   // фонды да HDRI-мен ауыстырғың келсе
  }
);
scene.background = new THREE.Color(0x030806);
scene.fog        = new THREE.Fog(0x030806, 80, 250);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
const initialCameraPos = new THREE.Vector3(0, 20, 40);
camera.position.copy(initialCameraPos);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping  = true;
controls.dampingFactor  = 0.07;
controls.minDistance    = 0.5;
controls.maxDistance    = 150;
controls.maxPolarAngle  = Math.PI / 2 + 0.08;
// Explicit touch mapping — prevents OrbitControls from "losing" touch state
controls.touches = {
  ONE: THREE.TOUCH.ROTATE,
  TWO: THREE.TOUCH.DOLLY_PAN,
};
// As soon as the user starts rotating/zooming/panning,
// cancel any in-progress camera animation immediately so the
// lerp never overrides their input.
controls.addEventListener('start', () => { camAnim = false; });

// ── Lights ──
scene.add(new THREE.AmbientLight(0x8fa892, 0.55));

const sun = new THREE.DirectionalLight(0xfff3d0, 1.5);
sun.position.set(30, 60, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near   = 0.5;
sun.shadow.camera.far    = 250;
['left','right','top','bottom'].forEach((d,i) => sun.shadow.camera[d] = [-60,60,60,-60][i]);
scene.add(sun);

const fill = new THREE.DirectionalLight(0x4a8f5a, 0.25);
fill.position.set(-20, 10, -15);
scene.add(fill);

const grid = new THREE.GridHelper(15, 6, 0x1a3520, 0x111e12);
grid.material.opacity    = 0.25;
grid.material.transparent = true;
scene.add(grid);

// ═══════════════════════════════════════════════════════════════════════════
// POST PROCESSING
// ═══════════════════════════════════════════════════════════════════════════
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const outlinePass = new OutlinePass(
  new THREE.Vector2(viewport.clientWidth, viewport.clientHeight),
  scene, camera
);
outlinePass.edgeStrength  = 3.5;
outlinePass.edgeGlow      = 0.4;
outlinePass.edgeThickness = 1.5;
outlinePass.pulsePeriod   = 0;
outlinePass.visibleEdgeColor.set('#ffffff');
outlinePass.hiddenEdgeColor.set('#555555');
composer.addPass(outlinePass);

const fxaaPass = new ShaderPass(FXAAShader);
composer.addPass(fxaaPass);
composer.addPass(new OutputPass());

// ── Resize ──
function onResize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  composer.setSize(w, h);
  const pr = renderer.getPixelRatio();
  fxaaPass.material.uniforms['resolution'].value.set(1/(w*pr), 1/(h*pr));
}
new ResizeObserver(onResize).observe(viewport);
onResize();

// ═══════════════════════════════════════════════════════════════════════════
// RAYCASTING  — pointer-based (mouse + touch unified)
//   We track pointerdown position; fire selection only when the pointer
//   barely moved (tap / click, not drag / pan).
// ═══════════════════════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const ptr       = new THREE.Vector2();

let _pdX = 0, _pdY = 0, _pdTime = 0;
const TAP_MAX_DIST = 8;   // px — max movement to still count as a tap
const TAP_MAX_MS   = 400; // ms — max duration

function getCanvasXY(e) {
  // Use clientX/Y for both PointerEvent (mouse) and the touch extracted below
  return { x: e.clientX, y: e.clientY };
}

canvas.addEventListener('pointerdown', e => {
  _pdX    = e.clientX;
  _pdY    = e.clientY;
  _pdTime = Date.now();
}, { passive: true });

canvas.addEventListener('pointerup', e => {
  const dx   = e.clientX - _pdX;
  const dy   = e.clientY - _pdY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const dt   = Date.now() - _pdTime;
  if (dist > TAP_MAX_DIST || dt > TAP_MAX_MS) return;

  const r  = canvas.getBoundingClientRect();
  ptr.x    =  ((e.clientX - r.left) / r.width)  * 2 - 1;
  ptr.y    = -((e.clientY - r.top)  / r.height) * 2 + 1;

  raycaster.setFromCamera(ptr, camera);
  const hits = raycaster.intersectObjects(scene.children, true);

  // ── KEY FIX: iterate ALL hits, not just hits[0].
  // A foreground mesh (ground, fence, outer shell) can block a zone that sits
  // behind it from the camera's perspective.  We skip non-zone hits and take
  // the first hit whose ancestor is a named zone.
  const zo = firstZoneHit(hits);
  if (zo) selectZone(zo);
}, { passive: true });

// Hover cursor (desktop only)
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const r = canvas.getBoundingClientRect();
  ptr.x    =  ((e.clientX - r.left) / r.width)  * 2 - 1;
  ptr.y    = -((e.clientY - r.top)  / r.height) * 2 + 1;
  raycaster.setFromCamera(ptr, camera);
  const hits = raycaster.intersectObjects(scene.children, true);
  canvas.style.cursor = firstZoneHit(hits) ? 'pointer' : 'default';
}, { passive: true });

// Walk up the parent chain of a mesh to find a named zone ancestor.
function findZoneObj(obj) {
  let cur = obj;
  while (cur) {
    if (cur.name && ZONE_NAMES.has(cur.name)) return cur;
    cur = cur.parent;
  }
  return null;
}

// Scan every hit (nearest → farthest) and return the first that belongs to a
// known zone.  This skips opaque foreground geometry that has no zone name.
function firstZoneHit(hits) {
  for (const hit of hits) {
    const zo = findZoneObj(hit.object);
    if (zo && ZONE_DATA[zo.name]) return zo;
  }
  return null;
}

// ═══════════════════════════════════════════════════════════════════════════
// SELECTION
// ═══════════════════════════════════════════════════════════════════════════
function selectZone(zoneObj) {
  selectedZone = zoneObj.name;
  outlinePass.selectedObjects = [zoneObj];
  focusOn(zoneObj);
  document.getElementById('back-btn').classList.add('show');
  document.getElementById('cursor-hint').classList.add('hide');
  renderPanel();

  // On mobile, scroll the info panel into view
  if (window.innerWidth <= 768) {
    setTimeout(() => {
      document.getElementById('info-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 300);
  }
}

function clearSelection() {
  selectedZone = null;
  outlinePass.selectedObjects = [];
  resetCam();
  document.getElementById('back-btn').classList.remove('show');
  document.getElementById('cursor-hint').classList.remove('hide');
  renderPanel();
}

// ═══════════════════════════════════════════════════════════════════════════
// CAMERA ANIMATION
// ═══════════════════════════════════════════════════════════════════════════
let camTarget = null, camLook = null, camAnim = false;

function focusOn(obj) {
  const box  = new THREE.Box3().setFromObject(obj);
  const ctr  = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dim  = Math.max(size.x, size.y, size.z) || 5;

  const dir = camera.position.clone().sub(ctr);
  if (dir.length() < 0.01) dir.set(1, 1, 1);
  dir.normalize().multiplyScalar(dim * 3.0);
  dir.y = Math.max(dir.y, dim * 1.3);

  camTarget = ctr.clone().add(dir);
  camLook   = ctr.clone();
  camAnim   = true;
}

function resetCam() {
  camTarget = initialCameraPos.clone();
  camLook   = new THREE.Vector3(0, 0, 0);
  camAnim   = true;
}

// ═══════════════════════════════════════════════════════════════════════════
// PANEL RENDERING
// ═══════════════════════════════════════════════════════════════════════════
function renderPanel() {
  const t  = UI[currentLang];
  const el = document.getElementById('panel-content');

  el.classList.remove('panel-anim');
  void el.offsetWidth;
  el.classList.add('panel-anim');

  if (!selectedZone) {
    el.innerHTML = `
      <div class="p-head">
        <div class="p-tag">🌿 ${t.gen_tag}</div>
        <div class="p-title">${t.gen_title}</div>
        <div class="p-subtitle">${t.gen_sub}</div>
      </div>
      <div class="p-body">
        <div class="p-img"><span class="p-img-icon">🌳</span></div>
        <div class="p-desc">${t.gen_desc}</div>
        <div class="p-stats">
          <div class="stat-card"><div class="stat-label">${t.area_l}</div><div class="stat-val">${t.area_v}</div></div>
          <div class="stat-card"><div class="stat-label">${t.spc_l}</div><div class="stat-val">${t.spc_v}</div></div>
          <div class="stat-card"><div class="stat-label">${t.fnd_l}</div><div class="stat-val">${t.fnd_v}</div></div>
          <div class="stat-card"><div class="stat-label">${t.zn_l}</div><div class="stat-val">${t.zn_v}</div></div>
        </div>
      </div>
      <div class="p-hint">
        <span class="p-hint-icon">◉</span>
        <span>${t.sel_hint}</span>
      </div>`;
  } else {
    const zd = ZONE_DATA[selectedZone]?.[currentLang];
    if (!zd) return;
    const icon = /^\d/.test(selectedZone) ? '🌱' : '🌿';
    el.innerHTML = `
      <div class="p-head">
        <div class="p-tag">🗺 ${t.zone_tag} ${selectedZone}</div>
        <div class="p-title">${zd.name}</div>
        <div class="p-subtitle">${t.gen_sub}</div>
      </div>
      <div class="p-body">
        <div class="p-img"><span class="p-img-icon">${icon}</span></div>
        <div class="p-desc">${zd.desc}</div>
        <div class="p-props">
          <div class="prop-row"><span class="prop-key">${t.type_l}</span><span class="prop-val">${zd.type}</span></div>
          <div class="prop-row"><span class="prop-key">${t.plants_l}</span><span class="prop-val">${zd.plants}</span></div>
          <div class="prop-row"><span class="prop-key">ID</span><span class="prop-val">${selectedZone}</span></div>
        </div>
      </div>`;
  }

  document.getElementById('panel-footer').textContent = t.footer;
}

// ═══════════════════════════════════════════════════════════════════════════
// LANGUAGE SWITCH
// ═══════════════════════════════════════════════════════════════════════════
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLang = btn.dataset.lang;
    const t = UI[currentLang];
    document.getElementById('hdr-title').textContent     = t.title;
    document.getElementById('hdr-sub').textContent       = t.sub;
    document.getElementById('loading-label').textContent = t.loading;
    document.getElementById('back-label').textContent    = t.back;
    document.getElementById('cursor-hint').textContent   = t.cursor_hint;
    renderPanel();
  });
});

document.getElementById('back-btn').addEventListener('click', clearSelection);

// ═══════════════════════════════════════════════════════════════════════════
// LOAD GLB
// ═══════════════════════════════════════════════════════════════════════════
const glLoader = new GLTFLoader();
const loadEl   = document.getElementById('loading');
const pctEl    = document.getElementById('load-pct');
const barEl    = document.getElementById('loader-bar');

glLoader.load(
  'BotSadBezKol.glb',
  gltf => {
    scene.add(gltf.scene);
    gltf.scene.traverse(child => {
      if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
    });

    const box  = new THREE.Box3().setFromObject(gltf.scene);
    const ctr  = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const dim  = Math.max(size.x, size.y, size.z);

    initialCameraPos.set(ctr.x, ctr.y + dim * 0.65, ctr.z + dim * 1.1);
    camera.position.copy(initialCameraPos);
    controls.target.copy(ctr);
    controls.update();

    grid.position.y = box.min.y;

    loadEl.classList.add('hidden');
    setTimeout(() => loadEl.style.display = 'none', 750);
    renderPanel();
  },
  prog => {
    if (prog.total > 0) {
      const p = Math.round((prog.loaded / prog.total) * 100);
      pctEl.textContent = `${p}%`;
      barEl.style.width = `${p}%`;
    }
  },
  err => {
    console.error('GLB load error:', err);
    pctEl.textContent = '⚠ Файл жүктелмеді / Файл не загружен / Failed to load';
    pctEl.style.color = '#ff5555';
  }
);

// ═══════════════════════════════════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);

  if (camAnim && camTarget && camLook) {
    // Lerp camera directly — do NOT call controls.update() this frame
    // so OrbitControls damping doesn't fight our animation.
    camera.position.lerp(camTarget, 0.055);
    controls.target.lerp(camLook, 0.055);
    camera.lookAt(controls.target);
    if (camera.position.distanceTo(camTarget) < 0.05) {
      camera.position.copy(camTarget);
      controls.target.copy(camLook);
      camAnim = false;
      controls.update(); // sync internal state once animation ends
    }
  } else {
    controls.update();
  }
  composer.render();
}

animate();
renderPanel();
</script>
