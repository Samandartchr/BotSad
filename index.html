<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ботаникалық бақ · ХҚТУ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>

<script type="importmap">{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="app">

  <!-- ── HEADER ── -->
  <header id="app-header">
    <div class="hdr-brand">
      <span id="hdr-title">Ботаникалық бақ</span>
      <span id="hdr-sub">Қ.А. Яссауи атындағы ХҚТУ</span>
    </div>
  </header>

  <!-- ── APP BODY: 3 columns ── -->
  <div id="app-body">

    <!-- LEFT COLUMN: Zone list (desktop 15%) -->
    <aside id="zone-panel">
      <div class="zl-header">
        <span class="zl-header-title" id="zones-title-label">Зоналар тізімі</span>
        <span id="zone-count-badge" class="zone-count-badge">53</span>
      </div>
      <div id="zone-list" class="zone-list-container"></div>
    </aside>

    <!-- CENTER COLUMN: Viewport (desktop 65%) -->
    <div id="viewport-area">

      <!-- Back button — top-right inside viewport -->
      <button id="back-btn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="back-label">Артқа</span>
      </button>

      <!-- 2D MAP -->
      <div id="map-view">
        <div id="map"></div>
        <div class="cursor-hint" id="cursor-hint-2d">Зонаны басыңыз</div>
      </div>

      <!-- 3D CANVAS -->
      <div id="canvas-view">
        <canvas id="canvas3d"></canvas>
        <div id="loading">
          <div class="spinner"></div>
          <div id="load-pct">0%</div>
          <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
          <span id="loading-label">Жүктелуде…</span>
        </div>
        <div class="cursor-hint" id="cursor-hint-3d">3D моделдегі зонаны басыңыз</div>
      </div>

    </div><!-- /viewport-area -->

    <!-- RIGHT COLUMN: Controls + Info (desktop 20%) / Mobile drawer -->
    <aside id="right-panel">

      <!-- Mobile: close button (hidden on desktop via CSS) -->
      <button id="mobile-close-btn" class="mobile-only" aria-label="Жабу">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span style="font-size:11px;margin-right:auto;color:var(--text3);font-family:'Unbounded',sans-serif;letter-spacing:.05em">ЖАБУ</span>
      </button>

      <!-- Language switcher -->
      <div class="rp-section">
        <div class="rp-section-label">Тіл / Язык</div>
        <div class="lang-group">
          <button class="lang-btn active" data-lang="kk">ҚАЗ</button>
          <button class="lang-btn" data-lang="ru">РУС</button>
          <button class="lang-btn" data-lang="en">ENG</button>
          <button class="lang-btn" data-lang="tr">TUR</button>
        </div>
      </div>

      <!-- View toggle: 2D / 3D -->
      <div class="rp-section">
        <div class="rp-section-label">Режим</div>
        <div class="view-toggle">
          <button id="btn-2d" class="tog-btn active">
            <span class="tog-icon">🗺</span>2D
          </button>
          <button id="btn-3d" class="tog-btn">
            <span class="tog-icon">🧊</span>3D
          </button>
        </div>
      </div>

      <!-- Mobile-only: Zone list inside drawer -->
      <div id="mobile-zone-section" class="mobile-only" style="flex-direction:column;border-bottom:1px solid var(--border2);flex-shrink:0;max-height:38vh;display:none">
        <div class="zl-header">
          <span class="zl-header-title" id="zones-title-label-m">Зоналар тізімі</span>
          <span id="zone-count-badge-m" class="zone-count-badge"></span>
        </div>
        <div id="zone-list-m" class="zone-list-container" style="overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--border) transparent"></div>
      </div>

      <!-- Info section -->
      <div id="info-section">
        <div id="panel-content"></div>
        <div id="panel-footer">ХҚТУ · Ботаникалық бақ</div>
      </div>

    </aside><!-- /right-panel -->

  </div><!-- /app-body -->
</div><!-- /app -->

<!-- Mobile overlay backdrop -->
<div id="mobile-overlay"></div>

<!-- Mobile drawer handle -->
<button id="mobile-menu-btn" aria-label="Мәзір">
  &lt;
</button>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
